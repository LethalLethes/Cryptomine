<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CryptoMine — Idle Clicker</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CryptoMine">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2236;
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --gold: #ffd700;
    --green: #00ff88;
    --text: #e0eaff;
    --muted: #4a5568;
    --border: rgba(0,229,255,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(0,229,255,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(255,107,53,0.04) 0%, transparent 50%);
  }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(17,24,39,0.8);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-title {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .coin-display {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .coin-amount {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 15px rgba(255,215,0,0.4);
  }

  .cps-display {
    font-size: 11px;
    color: var(--green);
    opacity: 0.8;
  }

  /* MAIN CLICKER */
  .clicker-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 24px;
    position: relative;
  }

  .mine-btn {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #1e3a5f, #0a1628);
    border: 3px solid var(--accent);
    box-shadow:
      0 0 30px rgba(0,229,255,0.25),
      0 0 60px rgba(0,229,255,0.1),
      inset 0 0 30px rgba(0,229,255,0.05);
    cursor: pointer;
    position: relative;
    transition: transform 0.08s, box-shadow 0.08s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
    user-select: none;
    -webkit-user-select: none;
  }

  .mine-btn:active {
    transform: scale(0.93);
    box-shadow:
      0 0 50px rgba(0,229,255,0.5),
      0 0 100px rgba(0,229,255,0.2),
      inset 0 0 40px rgba(0,229,255,0.1);
  }

  .mine-icon {
    font-size: 52px;
    line-height: 1;
    filter: drop-shadow(0 0 8px rgba(0,229,255,0.4));
  }

  .mine-label {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    color: var(--accent);
    letter-spacing: 1.5px;
    opacity: 0.7;
  }

  .tap-power {
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
  }

  .tap-power span {
    color: var(--accent);
    font-weight: 600;
  }

  /* FLOATING COINS */
  .float-coin {
    position: fixed;
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(255,215,0,0.8);
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
    z-index: 999;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
  }

  /* PROGRESS BAR */
  .level-bar {
    width: calc(100% - 40px);
    margin: 0 20px 8px;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .level-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 2px;
    transition: width 0.3s ease;
    box-shadow: 0 0 8px rgba(0,229,255,0.5);
  }

  .level-info {
    display: flex;
    justify-content: space-between;
    padding: 0 20px 20px;
    font-size: 11px;
    color: var(--muted);
  }

  .level-info span { color: var(--accent); font-weight: 600; }

  /* TABS */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    gap: 4px;
  }

  .tab-btn {
    flex: 1;
    padding: 10px 8px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* UPGRADES */
  .tab-content { display: none; padding: 16px 20px; }
  .tab-content.active { display: block; }

  .upgrades-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .upgrade-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .upgrade-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,229,255,0.03), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .upgrade-card:active::before { opacity: 1; }

  .upgrade-card.affordable {
    border-color: rgba(0,229,255,0.35);
    box-shadow: 0 0 15px rgba(0,229,255,0.08);
  }

  .upgrade-card.maxed {
    border-color: rgba(0,255,136,0.3);
    opacity: 0.7;
  }

  .upgrade-card.cant-afford {
    opacity: 0.5;
  }

  .upgrade-icon {
    font-size: 32px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.2));
  }

  .upgrade-info { flex: 1; min-width: 0; }

  .upgrade-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .upgrade-desc {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .upgrade-level-bar {
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .upgrade-level-fill {
    height: 100%;
    background: var(--accent2);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .upgrade-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }

  .upgrade-cost {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    color: var(--gold);
    font-weight: 700;
  }

  .upgrade-lvl {
    font-size: 11px;
    color: var(--muted);
  }

  .upgrade-cps {
    font-size: 10px;
    color: var(--green);
  }

  /* STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .stat-value {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 700;
  }

  .stat-value.gold { color: var(--gold); }
  .stat-value.cyan { color: var(--accent); }
  .stat-value.green { color: var(--green); }
  .stat-value.orange { color: var(--accent2); }

  /* PRESTIGE */
  .prestige-section {
    background: linear-gradient(135deg, rgba(255,107,53,0.1), rgba(255,215,0,0.05));
    border: 1px solid rgba(255,107,53,0.3);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    margin-bottom: 16px;
  }

  .prestige-title {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    color: var(--accent2);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .prestige-desc {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .prestige-btn {
    background: linear-gradient(135deg, var(--accent2), #e55b2a);
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    color: white;
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(255,107,53,0.3);
  }

  .prestige-btn:active { transform: scale(0.97); }
  .prestige-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* NOTIFICATION */
  .notif {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--accent);
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
    white-space: nowrap;
    box-shadow: 0 0 20px rgba(0,229,255,0.2);
  }

  .notif.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">⛏ CRYPTOMINE</div>
  <div class="coin-display">
    <div class="coin-amount" id="coinDisplay">0</div>
    <div class="cps-display" id="cpsDisplay">+0/s</div>
  </div>
</div>

<!-- CLICKER -->
<div class="clicker-section">
  <button class="mine-btn" id="mineBtn" onclick="tapMine(event)" ontouchstart="handleTouch(event)">
    <div class="mine-icon">⛏️</div>
    <div class="mine-label">MINE</div>
  </button>
  <div class="tap-power">Tap gücü: <span id="tapPower">1</span> coin</div>
</div>

<!-- LEVEL -->
<div class="level-bar">
  <div class="level-fill" id="levelFill" style="width:0%"></div>
</div>
<div class="level-info">
  <div>Səviyyə <span id="levelNum">1</span></div>
  <div><span id="levelProgress">0</span> / <span id="levelNext">100</span></div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('upgrades')">🔧 Yüksəltmə</button>
  <button class="tab-btn" onclick="switchTab('passive')">⚡ Passiv</button>
  <button class="tab-btn" onclick="switchTab('stats')">📊 Statistika</button>
</div>

<!-- UPGRADES TAB -->
<div class="tab-content active" id="tab-upgrades">
  <div class="upgrades-grid" id="upgradesGrid"></div>
</div>

<!-- PASSIVE TAB -->
<div class="tab-content" id="tab-passive">
  <div class="upgrades-grid" id="passiveGrid"></div>
</div>

<!-- STATS TAB -->
<div class="tab-content" id="tab-stats">
  <div class="prestige-section">
    <div class="prestige-title">🔥 PRESTİJ</div>
    <div class="prestige-desc">Bütün coinlərini sıfırla, lakin <strong>x<span id="prestigeMultiplier">1.5</span></strong> daimi bonus qazan.<br>Hazırda <span id="prestigeCount">0</span> prestijiyin var.</div>
    <button class="prestige-btn" id="prestigeBtn" onclick="doPrestige()">PRESTİJ ET</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Ümumi Tap</div>
      <div class="stat-value orange" id="statTaps">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ümumi Qazanc</div>
      <div class="stat-value gold" id="statTotal">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Coin/Saniyə</div>
      <div class="stat-value green" id="statCps">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Prestijiyin</div>
      <div class="stat-value cyan" id="statPrestige">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tap Gücü</div>
      <div class="stat-value cyan" id="statTapPower">1</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Səviyyə</div>
      <div class="stat-value green" id="statLevel">1</div>
    </div>
  </div>
</div>

<!-- NOTIFICATION -->
<div class="notif" id="notif"></div>

<script>
// ============ GAME STATE ============
let state = {
  coins: 0,
  totalCoins: 0,
  taps: 0,
  prestige: 0,
  prestigeMultiplier: 1,
  level: 1,
  levelXp: 0,
  upgrades: {},
  passive: {}
};

// ============ UPGRADE DATA ============
const TAP_UPGRADES = [
  { id: 'pick',      icon: '⛏️',  name: 'Dəmir Külüng',      desc: '+1 tap gücü',          baseCost: 10,          costMult: 1.5,  tapBonus: 1,        maxLevel: 20 },
  { id: 'gloves',    icon: '🧤',  name: 'Miner Əlcəyi',      desc: '+3 tap gücü',          baseCost: 50,          costMult: 1.6,  tapBonus: 3,        maxLevel: 15 },
  { id: 'drill',     icon: '🔩',  name: 'Qazma Maşını',      desc: '+10 tap gücü',         baseCost: 300,         costMult: 1.7,  tapBonus: 10,       maxLevel: 12 },
  { id: 'laser',     icon: '🔦',  name: 'Lazer Miner',       desc: '+30 tap gücü',         baseCost: 2000,        costMult: 1.8,  tapBonus: 30,       maxLevel: 10 },
  { id: 'quantum',   icon: '⚡',  name: 'Kvant Miner',       desc: '+100 tap gücü',        baseCost: 15000,       costMult: 2.0,  tapBonus: 100,      maxLevel: 8  },
  { id: 'plasma',    icon: '🌪️', name: 'Plazma Əlcəyi',     desc: '+500 tap gücü',        baseCost: 200000,      costMult: 2.1,  tapBonus: 500,      maxLevel: 8  },
  { id: 'nanobot',   icon: '🦾',  name: 'Nanobot Əli',       desc: '+2.000 tap gücü',      baseCost: 5e6,         costMult: 2.2,  tapBonus: 2000,     maxLevel: 7  },
  { id: 'dark',      icon: '🌑',  name: 'Qaranlıq Maddə',    desc: '+10.000 tap gücü',     baseCost: 200e6,       costMult: 2.3,  tapBonus: 10000,    maxLevel: 6  },
  { id: 'singularity',icon:'🕳️', name: 'Sinkullarlıq',      desc: '+50.000 tap gücü',     baseCost: 8e9,         costMult: 2.4,  tapBonus: 50000,    maxLevel: 5  },
  { id: 'nebula',    icon: '🌌',  name: 'Nebula Gücü',       desc: '+250.000 tap gücü',    baseCost: 500e9,       costMult: 2.5,  tapBonus: 250000,   maxLevel: 5  },
  { id: 'godhand',   icon: '🖐️', name: 'İlahi Əl',          desc: '+1M tap gücü',         baseCost: 50e12,       costMult: 2.6,  tapBonus: 1000000,  maxLevel: 4  },
  { id: 'universe',  icon: '✨',  name: 'Kainat Zərbəsi',    desc: '+10M tap gücü',        baseCost: 10e15,       costMult: 2.8,  tapBonus: 10000000, maxLevel: 3  },
];

const PASSIVE_UPGRADES = [
  { id: 'robot',    icon: '🤖',  name: 'Mini Robot',        desc: '+1 coin/s',          baseCost: 25,        costMult: 1.5,  cps: 1,             maxLevel: 25 },
  { id: 'mine',     icon: '🏭',  name: 'Mina Zavodu',       desc: '+5 coin/s',          baseCost: 150,       costMult: 1.6,  cps: 5,             maxLevel: 20 },
  { id: 'server',   icon: '💻',  name: 'Kripto Server',     desc: '+15 coin/s',         baseCost: 800,       costMult: 1.7,  cps: 15,            maxLevel: 15 },
  { id: 'farm',     icon: '🌾',  name: 'GPU Farm',          desc: '+50 coin/s',         baseCost: 5000,      costMult: 1.8,  cps: 50,            maxLevel: 12 },
  { id: 'quantum2', icon: '🌀',  name: 'Kvant Kompüter',    desc: '+200 coin/s',        baseCost: 40000,     costMult: 2.0,  cps: 200,           maxLevel: 10 },
  { id: 'datacntr', icon: '🏙️', name: 'Data Mərkəzi',      desc: '+1.000 coin/s',      baseCost: 500000,    costMult: 2.1,  cps: 1000,          maxLevel: 10 },
  { id: 'satellite',icon: '🛰️', name: 'Kripto Peyki',      desc: '+5.000 coin/s',      baseCost: 8e6,       costMult: 2.2,  cps: 5000,          maxLevel: 8  },
  { id: 'moonbase', icon: '🌕',  name: 'Ay Bazası',         desc: '+25.000 coin/s',     baseCost: 150e6,     costMult: 2.3,  cps: 25000,         maxLevel: 8  },
  { id: 'dyson',    icon: '☀️',  name: 'Dyson Sferası',     desc: '+100.000 coin/s',    baseCost: 5e9,       costMult: 2.4,  cps: 100000,        maxLevel: 6  },
  { id: 'wormhole', icon: '🌀',  name: 'Qurd Dəliyi',       desc: '+500.000 coin/s',    baseCost: 200e9,     costMult: 2.5,  cps: 500000,        maxLevel: 6  },
  { id: 'blackhole',icon: '⚫',  name: 'Qara Dəlik Reaktoru', desc: '+2M coin/s',       baseCost: 10e12,     costMult: 2.6,  cps: 2000000,       maxLevel: 5  },
  { id: 'multiverse',icon:'🔮', name: 'Çoxlu Kainat',       desc: '+10M coin/s',        baseCost: 1e15,      costMult: 2.7,  cps: 10000000,      maxLevel: 5  },
  { id: 'timemachine',icon:'⏳', name: 'Zaman Maşını',      desc: '+100M coin/s',       baseCost: 200e15,    costMult: 2.8,  cps: 100000000,     maxLevel: 4  },
  { id: 'omnipwr',  icon: '🌟',  name: 'Omnigüc Reaktoru',  desc: '+1B coin/s',         baseCost: 50e18,     costMult: 3.0,  cps: 1000000000,    maxLevel: 3  },
];

// ============ HELPERS ============
function fmt(n) {
  n = Math.floor(n);
  const tiers = [
    [1e33, 'Dc'], [1e30, 'No'], [1e27, 'Oc'], [1e24, 'Sp'],
    [1e21, 'Sx'], [1e18, 'Qi'], [1e15, 'Qa'], [1e12, 'T'],
    [1e9,  'B'],  [1e6,  'M'],  [1e3,  'K']
  ];
  for (const [val, sfx] of tiers) {
    if (n >= val) return (n / val).toFixed(2).replace(/\.?0+$/, '') + sfx;
  }
  return n.toString();
}

function getUpgradeCost(upg, type) {
  const lvl = (type === 'tap' ? state.upgrades : state.passive)[upg.id] || 0;
  if (lvl >= upg.maxLevel) return Infinity;
  return Math.floor(upg.baseCost * Math.pow(upg.costMult, lvl));
}

function getTapPower() {
  let base = 1;
  TAP_UPGRADES.forEach(u => {
    base += u.tapBonus * (state.upgrades[u.id] || 0);
  });
  return Math.floor(base * state.prestigeMultiplier);
}

function getCPS() {
  let cps = 0;
  PASSIVE_UPGRADES.forEach(u => {
    cps += u.cps * (state.passive[u.id] || 0);
  });
  return cps * state.prestigeMultiplier;
}

function getLevelThreshold(lvl) {
  return Math.floor(100 * Math.pow(1.4, lvl - 1));
}

// ============ GAME ACTIONS ============
function handleTouch(e) {
  e.preventDefault(); // onclick-i bloklayır, ikiqat sayılmır
  const touches = e.changedTouches;
  for (let i = 0; i < touches.length; i++) {
    const t = touches[i];
    doTap(t.clientX, t.clientY);
  }
}

function tapMine(e) {
  // Yalnız mouse click üçün (touch artıq handleTouch-da işləndi)
  if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
  doTap(e.clientX, e.clientY);
}

function doTap(x, y) {
  const power = getTapPower();
  state.coins += power;
  state.totalCoins += power;
  state.taps++;

  state.levelXp += 1;
  const needed = getLevelThreshold(state.level);
  if (state.levelXp >= needed) {
    state.levelXp -= needed;
    state.level++;
    showNotif(`🎉 Səviyyə ${state.level}!`);
  }

  spawnFloat(x, y, '+' + fmt(power));
  updateUI();
  saveState();
}

function buyUpgrade(id, type) {
  const list = type === 'tap' ? TAP_UPGRADES : PASSIVE_UPGRADES;
  const upg = list.find(u => u.id === id);
  const storeObj = type === 'tap' ? state.upgrades : state.passive;
  const cost = getUpgradeCost(upg, type);

  if (cost === Infinity) { showNotif('✅ Maks səviyyəyə çatdı!'); return; }
  if (state.coins < cost) { showNotif('❌ Yetəri qədər coin yoxdur!'); return; }

  state.coins -= cost;
  storeObj[id] = (storeObj[id] || 0) + 1;
  showNotif(`✅ ${upg.name} yüksəldildi!`);
  updateUI();
  renderUpgrades();
  saveState();
}

function doPrestige() {
  const threshold = 10000 * Math.pow(5, state.prestige);
  if (state.totalCoins < threshold) {
    showNotif(`❌ ${fmt(threshold)} ümumi coin lazımdır!`);
    return;
  }
  state.prestige++;
  state.prestigeMultiplier = Math.pow(1.5, state.prestige);
  state.coins = 0;
  state.totalCoins = 0;
  state.levelXp = 0;
  state.upgrades = {};
  state.passive = {};
  showNotif(`🔥 Prestiij! x${state.prestigeMultiplier.toFixed(2)} bonus!`);
  updateUI();
  renderUpgrades();
  saveState();
}

// ============ PASSIVE INCOME ============
setInterval(() => {
  const cps = getCPS();
  if (cps > 0) {
    state.coins += cps / 10;
    state.totalCoins += cps / 10;
    updateUI();
  }
}, 100);

// ============ UI ============
function updateUI() {
  const cps = getCPS();
  const tapPow = getTapPower();
  document.getElementById('coinDisplay').textContent = fmt(state.coins);
  document.getElementById('cpsDisplay').textContent = `+${fmt(cps)}/s`;
  document.getElementById('tapPower').textContent = fmt(tapPow);
  document.getElementById('levelNum').textContent = state.level;
  const needed = getLevelThreshold(state.level);
  document.getElementById('levelProgress').textContent = fmt(state.levelXp);
  document.getElementById('levelNext').textContent = fmt(needed);
  document.getElementById('levelFill').style.width = (state.levelXp / needed * 100) + '%';

  // Stats
  document.getElementById('statTaps').textContent = fmt(state.taps);
  document.getElementById('statTotal').textContent = fmt(state.totalCoins);
  document.getElementById('statCps').textContent = fmt(cps);
  document.getElementById('statPrestige').textContent = state.prestige;
  document.getElementById('statTapPower').textContent = fmt(tapPow);
  document.getElementById('statLevel').textContent = state.level;

  // Prestige
  const threshold = Math.floor(10000 * Math.pow(5, state.prestige));
  document.getElementById('prestigeMultiplier').textContent = Math.pow(1.5, state.prestige + 1).toFixed(2);
  document.getElementById('prestigeCount').textContent = state.prestige;
  document.getElementById('prestigeBtn').disabled = state.totalCoins < threshold;
}

function renderUpgrades() {
  renderGrid('upgradesGrid', TAP_UPGRADES, 'tap');
  renderGrid('passiveGrid', PASSIVE_UPGRADES, 'passive');
}

function renderGrid(containerId, list, type) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  list.forEach(upg => {
    const lvl = (type === 'tap' ? state.upgrades : state.passive)[upg.id] || 0;
    const cost = getUpgradeCost(upg, type);
    const maxed = lvl >= upg.maxLevel;
    const canAfford = state.coins >= cost;

    let cls = 'upgrade-card';
    if (maxed) cls += ' maxed';
    else if (canAfford) cls += ' affordable';
    else cls += ' cant-afford';

    const progress = (lvl / upg.maxLevel * 100);
    const cpsOrTap = type === 'tap'
      ? `+${upg.tapBonus * lvl} tap gücü`
      : `+${fmt(upg.cps * lvl)}/s`;

    container.innerHTML += `
      <div class="${cls}" onclick="buyUpgrade('${upg.id}','${type}')">
        <div class="upgrade-icon">${upg.icon}</div>
        <div class="upgrade-info">
          <div class="upgrade-name">${upg.name}</div>
          <div class="upgrade-desc">${upg.desc}</div>
          <div class="upgrade-level-bar">
            <div class="upgrade-level-fill" style="width:${progress}%"></div>
          </div>
        </div>
        <div class="upgrade-right">
          <div class="upgrade-cost">${maxed ? 'MAX' : '🪙' + fmt(cost)}</div>
          <div class="upgrade-lvl">Lvl ${lvl}/${upg.maxLevel}</div>
          ${lvl > 0 ? `<div class="upgrade-cps">${cpsOrTap}</div>` : ''}
        </div>
      </div>`;
  });
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

function spawnFloat(x, y, text) {
  const el = document.createElement('div');
  el.className = 'float-coin';
  el.textContent = text;
  el.style.left = (x - 20) + 'px';
  el.style.top = (y - 30) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

let notifTimer;
function showNotif(msg) {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ============ SAVE/LOAD ============
function saveState() {
  localStorage.setItem('cryptomine_save', JSON.stringify(state));
}

function loadState() {
  try {
    const saved = localStorage.getItem('cryptomine_save');
    if (saved) {
      const parsed = JSON.parse(saved);
      Object.assign(state, parsed);
    }
  } catch(e) {}
}

// ============ INIT ============
loadState();
updateUI();
renderUpgrades();
setInterval(() => renderUpgrades(), 2000);

// PWA Service Worker qeydiyyatı
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
